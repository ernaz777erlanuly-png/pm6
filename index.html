// ---- Quiz logic ----
const QUIZ_SIZE = 30;
let current = [];

const elQuiz = document.getElementById('quiz');
const elStat = document.getElementById('stat');
const btnNew = document.getElementById('btnNew');
const btnCheck = document.getElementById('btnCheck');
const btnReset = document.getElementById('btnReset');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function letters(i){ return ["A","B","C","D","E"][i] ?? "?"; }

function newQuiz(){
  const shuffled = shuffle(BANK);
  current = shuffled.slice(0, Math.min(QUIZ_SIZE, shuffled.length));
  render();
  elStat.textContent = `Сұрақ саны: ${current.length}. Тақырыптар аралас.`;
  btnCheck.disabled = false;
  window.scrollTo({top:0, behavior:"smooth"});
}

function render(){
  elQuiz.innerHTML = "";
  current.forEach((item, idx)=>{
    const card = document.createElement('div');
    card.className = 'qcard';
    card.dataset.idx = idx;

    const head = document.createElement('div');
    head.className = 'qhead';
    head.innerHTML = `
      <div class="qnum">${idx+1}</div>
      <div>
        <div class="qtext">${escapeHtml(item.q)}</div>
        <div class="key">Тақырып: <b>${escapeHtml(item.topic)}</b></div>
      </div>
    `;

    const opts = document.createElement('div');
    opts.className = 'opts';

    item.options.forEach((optText, optIdx)=>{
      const id = `q${idx}_o${optIdx}`;
      const lab = document.createElement('label');
      lab.className = 'opt';
      lab.setAttribute('for', id);
      lab.innerHTML = `
        <input type="radio" name="q${idx}" id="${id}" value="${optIdx}">
        <div class="letter">${letters(optIdx)})</div>
        <div class="otext">${escapeHtml(optText.replace(/^[A-E]\)\s*/,'')).trim()}</div>
      `;
      opts.appendChild(lab);
    });

    const note = document.createElement('div');
    note.className = 'note';
    note.textContent = "Жауапты таңда да, соңында “Тексеру” батырмасын бас.";

    card.appendChild(head);
    card.appendChild(opts);
    card.appendChild(note);

    elQuiz.appendChild(card);
  });
}

function getSelected(idx){
  const checked = document.querySelector(`input[name="q${idx}"]:checked`);
  return checked ? Number(checked.value) : null;
}

function resetSelections(){
  current.forEach((_, idx)=>{
    document.querySelectorAll(`input[name="q${idx}"]`).forEach(r=>r.checked=false);
  });
  document.querySelectorAll('.result').forEach(x=>x.remove());
  elStat.textContent = `Таңдаулар тазаланды. Сұрақ саны: ${current.length}.`;
  btnCheck.disabled = false;
}

function grade(){
  let correctCount = 0;
  let answered = 0;

  // remove old results
  document.querySelectorAll('.result').forEach(x=>x.remove());

  current.forEach((item, idx)=>{
    const chosen = getSelected(idx);
    if(chosen !== null) answered++;

    const isCorrect = (chosen === item.correct);
    if(isCorrect) correctCount++;

    const card = document.querySelector(`.qcard[data-idx="${idx}"]`);
    const res = document.createElement('div');
    res.className = 'result ' + (isCorrect ? 'good' : 'bad');

    const correctLetter = letters(item.correct);
    const chosenLetter = chosen === null ? "—" : letters(chosen);

    res.innerHTML = `
      <div><b>${isCorrect ? "Дұрыс" : "Қате"}</b></div>
      <div>Сенің жауабың: <b>${chosenLetter}</b> &nbsp;|&nbsp; Дұрыс жауап: <b>${correctLetter}</b></div>
    `;
    card.appendChild(res);
  });

  const total = current.length;
  elStat.textContent = `Нәтиже: ${correctCount}/${total}. Белгіленгені: ${answered}/${total}.`;
  btnCheck.disabled = true;
}

function escapeHtml(s){
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

btnNew.addEventListener('click', newQuiz);
btnCheck.addEventListener('click', grade);
btnReset.addEventListener('click', resetSelections);

// старт
newQuiz();
</script>

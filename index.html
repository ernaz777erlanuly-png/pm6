<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CMS — 150 сұрақ, 30 рандом (жауап бірден)</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:#111a2e;
      --text:#e7ecff;
      --muted:#aab4d6;
      --border:rgba(255,255,255,.12);
      --good:#1f9d55;
      --bad:#e55353;
      --btn:#2a3bff;
      --btn2:#23304f;
    }
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; background:linear-gradient(180deg,var(--bg),#070b14); color:var(--text);}
    .wrap{max-width:980px;margin:0 auto;padding:20px;}
    h1{font-size:20px;margin:0 0 10px;}
    .topbar{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      padding:12px; border:1px solid var(--border); border-radius:12px; background:rgba(17,26,46,.7);
      position:sticky; top:10px; backdrop-filter: blur(8px); z-index:5;
    }
    button{
      border:0; padding:10px 12px; border-radius:10px; cursor:pointer; color:var(--text);
      background:var(--btn2); font-weight:600;
    }
    button.primary{background:var(--btn);}
    .stat{margin-left:auto; color:var(--muted); font-size:14px;}
    .grid{display:flex; flex-direction:column; gap:12px; margin-top:14px;}
    .qcard{
      border:1px solid var(--border); border-radius:12px; background:rgba(17,26,46,.6);
      padding:14px;
    }
    .qhead{display:flex; gap:10px; align-items:flex-start;}
    .qnum{
      width:34px;height:34px; border-radius:10px; display:grid; place-items:center;
      background:rgba(255,255,255,.08); border:1px solid var(--border); flex:0 0 auto;
      font-weight:700;
    }
    .qtext{font-size:15px; line-height:1.35;}
    .opts{margin-top:10px; display:grid; gap:8px;}
    label.opt{
      display:flex; gap:10px; align-items:flex-start;
      padding:10px; border:1px solid var(--border); border-radius:10px;
      background:rgba(255,255,255,.03);
      cursor:pointer;
    }
    label.opt:hover{background:rgba(255,255,255,.06);}
    .opt input{margin-top:3px;}
    .opt .letter{width:22px; color:var(--muted); font-weight:700;}
    .note{margin-top:10px; font-size:13px; color:var(--muted);}
    .result{
      margin-top:10px; padding:10px; border-radius:10px; border:1px solid var(--border);
      font-size:13px;
    }
    .good{border-color:rgba(31,157,85,.5); background:rgba(31,157,85,.12);}
    .bad{border-color:rgba(229,83,83,.55); background:rgba(229,83,83,.10);}
    label.opt.correct {
      border-color: rgba(31,157,85,.55);
      background: rgba(31,157,85,.10);
    }
    label.opt.wrong {
      border-color: rgba(229,83,83,.60);
      background: rgba(229,83,83,.10);
    }
    .key{color:var(--muted); font-size:12px; margin-top:6px;}
    .footer{color:var(--muted); font-size:13px; margin-top:18px;}
    .pill{display:inline-block; padding:2px 8px; border:1px solid var(--border); border-radius:999px; background:rgba(255,255,255,.05);}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CMS — сессияға дайындық: <span class="pill">150 сұрақ</span> → <span class="pill">30 рандом</span> (жауап бірден)</h1>

    <div class="topbar">
      <button class="primary" id="btnNew">Жаңа 30 сұрақ</button>
      <button id="btnReset">Таңдауларды тазалау</button>
      <div class="stat" id="stat">Дайын.</div>
    </div>

    <div class="grid" id="quiz"></div>

    <div class="footer">
      Банкте барлығы <b>150</b> сұрақ. Әр ашқан сайын <b>30</b> рандом таңдалады.
    </div>
  </div>

const QUIZ_SIZE = 30;
let current = [];

const elQuiz = document.getElementById('quiz');
const elStat = document.getElementById('stat');
const btnNew = document.getElementById('btnNew');
const btnReset = document.getElementById('btnReset');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function letters(i){ return ["A","B","C","D","E"][i] ?? "?"; }

function escapeHtml(s){
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function getSelected(idx){
  const checked = document.querySelector(`input[name="q${idx}"]:checked`);
  return checked ? Number(checked.value) : null;
}

function updateStat(){
  let answered = 0, correct = 0;
  current.forEach((item, idx)=>{
    const chosen = getSelected(idx);
    if(chosen !== null){
      answered++;
      if(chosen === item.correct) correct++;
    }
  });
  elStat.textContent = `Белгіленгені: ${answered}/${current.length} | Дұрысы: ${correct}/${current.length}`;
}

function showImmediate(idx){
  const item = current[idx];
  const chosen = getSelected(idx);
  const card = document.querySelector(`.qcard[data-idx="${idx}"]`);
  if(!card) return;

  // Тазалау: ескі нәтиже + бояулар
  card.querySelectorAll('.result').forEach(x=>x.remove());
  card.querySelectorAll('label.opt').forEach(l=>l.classList.remove('correct','wrong'));

  if(chosen === null){
    updateStat();
    return;
  }

  // Label-дарды бояу
  const labels = card.querySelectorAll('label.opt');
  labels.forEach((lab, optIdx)=>{
    if(optIdx === item.correct) lab.classList.add('correct');
    if(optIdx === chosen && chosen !== item.correct) lab.classList.add('wrong');
  });

  const isCorrect = chosen === item.correct;
  const res = document.createElement('div');
  res.className = 'result ' + (isCorrect ? 'good' : 'bad');
  res.innerHTML = `
    <div><b>${isCorrect ? "Дұрыс" : "Қате"}</b></div>
    <div>Сенің жауабың: <b>${letters(chosen)}</b> | Дұрыс жауап: <b>${letters(item.correct)}</b></div>
  `;
  card.appendChild(res);

  updateStat();
}

function render(){
  elQuiz.innerHTML = "";
  current.forEach((item, idx)=>{
    const card = document.createElement('div');
    card.className = 'qcard';
    card.dataset.idx = idx;

    const head = document.createElement('div');
    head.className = 'qhead';
    head.innerHTML = `
      <div class="qnum">${idx+1}</div>
      <div>
        <div class="qtext">${escapeHtml(item.q)}</div>
        <div class="key">Тақырып: <b>${escapeHtml(item.topic)}</b></div>
      </div>
    `;

    const opts = document.createElement('div');
    opts.className = 'opts';

    item.options.forEach((optText, optIdx)=>{
      const id = `q${idx}_o${optIdx}`;

      const input = document.createElement('input');
      input.type = "radio";
      input.name = `q${idx}`;
      input.id = id;
      input.value = String(optIdx);
      input.addEventListener('change', ()=> showImmediate(idx)); // МІНЕ: бірден тексереді

      const lab = document.createElement('label');
      lab.className = 'opt';
      lab.setAttribute('for', id);

      const cleanText = optText.replace(/^[A-E]\)\s*/,'').trim();
      lab.appendChild(input);

      const letter = document.createElement('div');
      letter.className = 'letter';
      letter.textContent = `${letters(optIdx)})`;

      const txt = document.createElement('div');
      txt.className = 'otext';
      txt.innerHTML = escapeHtml(cleanText);

      lab.appendChild(letter);
      lab.appendChild(txt);

      opts.appendChild(lab);
    });

    const note = document.createElement('div');
    note.className = 'note';
    note.textContent = "Жауап таңдасаң — бірден дұрыс/қате шығады және дұрыс жауап боялады.";

    card.appendChild(head);
    card.appendChild(opts);
    card.appendChild(note);

    elQuiz.appendChild(card);
  });

  updateStat();
}

function newQuiz(){
  const shuffled = shuffle(BANK);
  current = shuffled.slice(0, Math.min(QUIZ_SIZE, shuffled.length));
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

function resetSelections(){
  current.forEach((_, idx)=>{
    document.querySelectorAll(`input[name="q${idx}"]`).forEach(r=>r.checked=false);
  });
  document.querySelectorAll('.result').forEach(x=>x.remove());
  document.querySelectorAll('label.opt').forEach(l=>l.classList.remove('correct','wrong'));
  updateStat();
}

btnNew.addEventListener('click', newQuiz);
btnReset.addEventListener('click', resetSelections);

// start
newQuiz();
